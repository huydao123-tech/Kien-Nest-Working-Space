spring:
  application:
    name: cowork-booking
  # PostgreSQL. Ghi đè bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD khi triển khai.
  # Giá trị mặc định khớp với db/setup-local.sql và docker-compose.yml (chỉ dùng cho máy dev).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cowork}
    username: ${DB_USERNAME:cowork}
    password: ${DB_PASSWORD:cowork}
  jpa:
    open-in-view: false
    hibernate:
      # Bảng do Flyway tạo (src/main/resources/db/migration). Hibernate chỉ kiểm tra entity khớp với bảng.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  time-zone: Asia/Ho_Chi_Minh
  seed-demo-data: true

# BR-02, BR-16, BR-17 trong SRS
booking:
  hold-duration: 10m
  check-in-early-window: 15m
  overstay-grace: 5m
  jobs:
    enabled: true
    hold-expiry-delay-ms: 30000
    overstay-delay-ms: 60000

# BR-03, BR-06 trong SRS
pricing:
  block-minutes: 30
  overstay-multiplier: 1.0

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret}
  sandbox:
    enabled: true
